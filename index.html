<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="author" content="66160084">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Workshop #HTML - CSS Template</h1>
        <div class="container">
            <form>
                <div class="form-group row col-sm-12 required mb-2">
                    <label for="name" class="col-sm-2 col-form-label">ชื่อ</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="name" placeholder="ชื่อ">
                    </div>
                </div>
                <div class="form-group row col-sm-12 mb-2">
                    <label for="surname" class="col-sm-2 col-form-label">สกุล</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="surname" placeholder="สกุล">
                    </div>
                </div>
                <div class="form-group row col-sm-12 mb-2">
                    <label for="birthdate" class="col-sm-2 col-form-label">วัน/เดือน/ปีเกิด</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="birthdate" placeholder="วัน/เดือน/ปีเกิด">
                    </div>
                </div>

                <div class="form-group row col-sm-12 mb-2">
                    <label for="sex" class="col-sm-2 col-form-label">เพศ</label>
                    <div class="col-sm-10">
                        <div>
                            <input class="form-check-input" type="radio" name="sex" id="male">
                            <label class="form-check-label" for="male">
                                ชาย
                            </label>
                        </div>
                        <div>

                            <input class="form-check-input" type="radio" name="sex" id="female">
                            <label class="form-check-label" for="female">
                                หญิง
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-group row col-sm-12 mb-2">
                    <label for="formFile" class="col-sm-2 col-form-label">รูป</label>
                    <div class="col-sm-10">
                        <input class="form-control" type="file" id="formFile">

                    </div>
                </div>

                <div class="form-group row col-sm-12 mb-2">
                    <label for="address" class="col-sm-2 col-form-label">ที่อยู่</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" id="address" rows="3"></textarea>
                    </div>
                </div>


                <div class="form-group row col-sm-12 mb-2">
                    <label for="favorite" class="col-sm-2 col-form-label">สีที่ชอบ</label>
                    <div class="col-sm-10">

                        <select id="colorFav" class="form-select">
                            <option value="red">Red</option>
                            <option value="green">Green</option>
                            <option value="blue">Blue</option>
                        </select>

                    </div>
                </div>

                <div class="form-group row col-sm-12 mb-2">
                    <label for="favmusic" class="col-sm-2 col-form-label">เพลงที่ชอบ</label>
                    <div class="col-sm-10">
                        <div>
                            <input class="form-check-input" type="radio" name="favmusic" id="favmusic1">
                            <label class="form-check-label" for="favmusic1">
                                เพื่อชีวิต
                            </label>
                        </div>
                        <div>
                            <input class="form-check-input" type="radio" name="favmusic" id="favmusic2">
                            <label class="form-check-label" for="favmusic2">
                                ลูกทุ่ง
                            </label>
                        </div>
                        <div>
                            <input class="form-check-input" type="radio" name="favmusic" id="favmusic3">
                            <label class="form-check-label" for="favmusic3">
                                อื่นๆ
                            </label>
                        </div>
                    </div>
                </div>


                <div class="form-group row col-sm-12 mb-2">
                    <div>
                        <input type="checkbox" id="accept" name="accept">
                        <label for="accept" class="col-form-label">ยินยอมให้เก็บขอมูล</label>
                    </div>
                </div>



                <div class="form-group row col-sm-12">
                    <div>
                        <input type="reset" value="Reset" class="btn btn-secondary">
                        <input type="submit" value="Submit" class="btn btn-success float-end">
                    </div>
                </div>


            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
